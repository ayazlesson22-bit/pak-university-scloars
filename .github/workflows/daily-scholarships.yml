name: Daily Pakistan Scholarships AI Pipeline

on:
  schedule:
    # 9:00 AM & 6:00 PM Pakistan Standard Time (PKT is UTC+5)
    # 04:00 UTC = 09:00 AM PKT
    # 13:00 UTC = 06:00 PM PKT
    - cron: '0 4,13 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  research-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Scholarship Research & Verification Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_scholarships.py

      - name: Commit and Publish Verified Scholarships
        run: |
          git config user.name "PK Scholarships Bot"
          git config user.email "bot@pkscholarships.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No new scholarships to commit. Everything is up to date."
          else
            git commit -m "🤖 Auto-publish: Updated verified Pakistan scholarships [skip ci]"
            git push origin main
          fi
